<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>🍕 Pizza App</h1>

        <section>
            <h2>Menu</h2>

            <div id="menu" class="menu">
            </div>
        </section>

        <section>
            <h2>Your Order</h2>

            <div id="order" class="order"></div>
            </div>

            <h3><span id="total">Total: $0</span></h3>

            <button id="complete-order">
                Complete Order
            </button>

            <div id="receipt" class="receipt hidden">
                <button id="close-receipt" class="close-receipt">×</button>

                <div id="receipt-content"></div>
            </div>
        </section>

    </main>

    <script src="./dist/pizza app 2.0.js"></script>
</body>
</html>
